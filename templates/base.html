{{define "base"}}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stockii</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        :root {
            --sk-bg-primary: #1a1d23;
            --sk-bg-secondary: #22262e;
            --sk-bg-tertiary: #2a2f38;
            --sk-accent: #9a61db;
            --sk-accent-hover: #8347c7;
            --sk-text-primary: #e1e4e8;
            --sk-text-muted: #8b949e;
            --sk-border: #333842;
            --sk-success: #3fb950;
            --sk-warning: #d29922;
            --sk-danger: #f85149;
        }
        body {
            background-color: var(--sk-bg-primary);
            color: var(--sk-text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
        }
        .sidebar {
            width: 220px;
            background-color: var(--sk-bg-secondary);
            min-height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            border-right: 1px solid var(--sk-border);
            z-index: 100;
        }
        .sidebar-brand {
            padding: 1.25rem 1rem;
            border-bottom: 1px solid var(--sk-border);
            font-size: 1.25rem;
            font-weight: 700;
            color: #e879a8;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .sidebar-nav {
            padding: 0.5rem 0;
        }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.625rem 1rem;
            color: var(--sk-text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.15s;
            border-left: 3px solid transparent;
        }
        .sidebar-nav a:hover {
            color: var(--sk-text-primary);
            background-color: var(--sk-bg-tertiary);
        }
        .sidebar-nav a.active {
            color: var(--sk-accent);
            border-left-color: var(--sk-accent);
            background-color: rgba(154, 97, 219, 0.12);
        }
        .main-content {
            margin-left: 220px;
            padding: 1.5rem 2rem;
            min-height: 100vh;
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--sk-border);
        }
        .page-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0;
        }
        .card {
            background-color: var(--sk-bg-secondary);
            border: 1px solid var(--sk-border);
            border-radius: 6px;
        }
        .card-header {
            background-color: var(--sk-bg-tertiary);
            border-bottom: 1px solid var(--sk-border);
            font-weight: 600;
            padding: 0.75rem 1rem;
        }
        .table {
            color: var(--sk-text-primary);
            margin-bottom: 0;
        }
        .table thead th {
            border-bottom: 2px solid var(--sk-border);
            color: var(--sk-text-muted);
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.625rem 0.75rem;
        }
        .table td {
            border-bottom: 1px solid var(--sk-border);
            padding: 0.625rem 0.75rem;
            vertical-align: middle;
        }
        .table tbody tr:hover {
            background-color: rgba(154, 97, 219, 0.08);
        }
        .table tbody tr.clickable-row {
            cursor: pointer;
        }
        .btn-sk {
            background-color: var(--sk-accent);
            border-color: var(--sk-accent);
            color: #fff;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .btn-sk:hover {
            background-color: var(--sk-accent-hover);
            border-color: var(--sk-accent-hover);
            color: #fff;
        }
        .btn-outline-sk {
            border-color: var(--sk-accent);
            color: var(--sk-accent);
            font-size: 0.85rem;
        }
        .btn-outline-sk:hover {
            background-color: var(--sk-accent);
            color: #fff;
        }
        .btn-sm {
            font-size: 0.78rem;
            padding: 0.2rem 0.5rem;
        }
        .stat-card {
            text-align: center;
            padding: 1.25rem;
        }
        .stat-card .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--sk-accent);
        }
        .stat-card .stat-label {
            color: var(--sk-text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--sk-text-muted);
        }
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
        }
        .form-control, .form-select {
            background-color: var(--sk-bg-tertiary);
            border-color: var(--sk-border);
            color: var(--sk-text-primary);
        }
        .form-control:focus, .form-select:focus {
            background-color: var(--sk-bg-tertiary);
            border-color: var(--sk-accent);
            color: var(--sk-text-primary);
            box-shadow: 0 0 0 0.15rem rgba(154, 97, 219, 0.25);
        }
        .badge-type-fanart { background-color: #e879a8; }
        .badge-type-original { background-color: #3b82f6; }
        .badge-type-mixed { background-color: #6b7280; }
        .text-muted-sk { color: var(--sk-text-muted) !important; }
        .sk-sortable { cursor: pointer; user-select: none; white-space: nowrap; }
        .sk-sortable:hover { color: var(--sk-text-primary) !important; }
        .sk-sort-icon { color: var(--sk-text-muted); margin-left: 0.2rem; font-size: 0.75em; }
        .product-thumb {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 4px;
        }
        .product-thumb-lg {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 6px;
        }
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: 60px;
                min-height: unset;
                top: unset;
                bottom: 0;
                left: 0;
                border-right: none;
                border-top: 1px solid var(--sk-border);
                z-index: 200;
                display: flex;
                align-items: stretch;
            }
            .sidebar-brand { display: none; }
            .sidebar-nav {
                display: flex;
                flex-direction: row;
                width: 100%;
                padding: 0;
            }
            .sidebar-nav a {
                flex: 1;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 0.15rem;
                padding: 0.4rem 0;
                font-size: 0.6rem;
                border-left: none;
                border-top: 3px solid transparent;
                text-align: center;
            }
            .sidebar-nav a i { font-size: 1.25rem; }
            .sidebar-nav a span { display: inline; }
            .sidebar-nav a.active {
                border-left-color: transparent;
                border-top-color: var(--sk-accent);
                background-color: rgba(154, 97, 219, 0.12);
            }
            .main-content {
                margin-left: 0;
                padding: 1rem 1rem 5rem;
            }
            #sk-toast-container {
                bottom: 60px !important;
            }
        }
        #sk-confirm-dialog {
            background: var(--sk-bg-secondary);
            border: 1px solid var(--sk-border);
            border-radius: 8px;
            color: var(--sk-text-primary);
            padding: 1.5rem;
            max-width: 420px;
            width: calc(100% - 2rem);
        }
        #sk-confirm-dialog::backdrop {
            background: rgba(0, 0, 0, 0.6);
        }
        #sk-confirm-message {
            margin: 0 0 1.25rem;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .sk-confirm-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
        }
        #sk-confirm-cancel {
            background: transparent;
            border: 1px solid var(--sk-border);
            color: var(--sk-text-primary);
            padding: 0.35rem 0.85rem;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
        }
        #sk-confirm-cancel:hover {
            border-color: var(--sk-text-muted);
            background: var(--sk-bg-tertiary);
        }
        #sk-confirm-ok {
            background: var(--sk-danger);
            border: 1px solid var(--sk-danger);
            color: #fff;
            padding: 0.35rem 0.85rem;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }
        #sk-confirm-ok:hover {
            background: #d43f38;
            border-color: #d43f38;
        }
    </style>
</head>
<body>
    <nav class="sidebar">
        <a href="/" class="sidebar-brand">
            <i class="bi bi-shop"></i>
            <span>Stockii</span>
        </a>
        <div class="sidebar-nav">
            <a href="/" class="{{if eq .Page "dashboard"}}active{{end}}">
                <i class="bi bi-grid-1x2"></i>
                <span>Dashboard</span>
            </a>
            <a href="/conventions" class="{{if eq .Page "conventions"}}active{{end}}">
                <i class="bi bi-calendar-event"></i>
                <span>Conventions</span>
            </a>
            <a href="/products" class="{{if eq .Page "products"}}active{{end}}">
                <i class="bi bi-box-seam"></i>
                <span>Products</span>
            </a>
            <a href="/reports" class="{{if eq .Page "reports"}}active{{end}}">
                <i class="bi bi-bar-chart-line"></i>
                <span>Reports</span>
            </a>
            <a href="/settings" class="{{if eq .Page "settings"}}active{{end}}">
                <i class="bi bi-gear"></i>
                <span>Settings</span>
            </a>
        </div>
    </nav>
    <div class="main-content">
        {{template "content" .}}
    </div>
    <dialog id="sk-confirm-dialog" aria-labelledby="sk-confirm-message">
        <p id="sk-confirm-message"></p>
        <div class="sk-confirm-actions">
            <button id="sk-confirm-cancel" type="button" autofocus>Cancel</button>
            <button id="sk-confirm-ok" type="button">Confirm</button>
        </div>
    </dialog>
    <div id="sk-toast-container" class="position-fixed bottom-0 end-0 p-3" style="z-index:1100;min-width:320px;max-width:420px;"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    function skInitSortable(tableId) {
        var table = document.getElementById(tableId);
        if (!table) return;
        var tbody = table.querySelector('tbody');
        var sortCol = -1, sortDir = 1;
        table.querySelectorAll('thead th.sk-sortable').forEach(function(th) {
            th.addEventListener('click', function() {
                var allThs = Array.from(table.querySelectorAll('thead th'));
                var colIdx = allThs.indexOf(th);
                if (sortCol === colIdx) { sortDir *= -1; } else { sortCol = colIdx; sortDir = 1; }
                table.querySelectorAll('thead th.sk-sortable .sk-sort-icon').forEach(function(ic) { ic.textContent = '↕'; });
                var icon = th.querySelector('.sk-sort-icon');
                if (icon) icon.textContent = sortDir === 1 ? '↑' : '↓';
                var rows = Array.from(tbody.querySelectorAll('tr'));
                rows.sort(function(a, b) {
                    var av = (a.cells[colIdx] ? a.cells[colIdx].textContent.trim() : '');
                    var bv = (b.cells[colIdx] ? b.cells[colIdx].textContent.trim() : '');
                    var an = parseFloat(av.replace(/[^0-9.\-]/g, ''));
                    var bn = parseFloat(bv.replace(/[^0-9.\-]/g, ''));
                    if (!isNaN(an) && !isNaN(bn) && av !== '' && bv !== '') return (an - bn) * sortDir;
                    var ad = new Date(av), bd = new Date(bv);
                    if (!isNaN(ad) && !isNaN(bd) && av.length > 4) return (ad - bd) * sortDir;
                    return av.localeCompare(bv) * sortDir;
                });
                rows.forEach(function(r) { tbody.appendChild(r); });
            });
        });
    }

    function showToast(message, type) {
        var container = document.getElementById('sk-toast-container');
        if (!container) return;
        var id = 'sk-t-' + Date.now();
        var delay = type === 'danger' ? 8000 : 4000;
        var typeClass = (type === 'danger' || type === 'success' || type === 'warning') ? type : 'secondary';
        container.insertAdjacentHTML('beforeend',
            '<div id="' + id + '" class="toast text-bg-' + typeClass + ' border-0" role="alert" data-bs-delay="' + delay + '">' +
            '<div class="d-flex align-items-center px-1">' +
            '<div class="toast-body">' + message + '</div>' +
            '<button type="button" class="btn-close btn-close-white me-2 ms-auto" data-bs-dismiss="toast"></button>' +
            '</div></div>');
        var el = document.getElementById(id);
        new bootstrap.Toast(el).show();
        el.addEventListener('hidden.bs.toast', function() { el.remove(); });
    }

    (function () {
        var dialog = document.getElementById('sk-confirm-dialog');
        var msgEl = document.getElementById('sk-confirm-message');
        var btnOk = document.getElementById('sk-confirm-ok');
        var btnCancel = document.getElementById('sk-confirm-cancel');

        if (!dialog) return;

        document.addEventListener('htmx:confirm', function (e) {
            e.preventDefault();

            msgEl.textContent = e.detail.question;
            dialog.showModal();

            function cleanup() {
                btnOk.removeEventListener('click', onOk);
                btnCancel.removeEventListener('click', onCancel);
                dialog.removeEventListener('cancel', onCancel);
            }
            function onOk() {
                cleanup();
                dialog.close();
                e.detail.issueRequest(true);
            }
            function onCancel() {
                cleanup();
                dialog.close();
            }

            btnOk.addEventListener('click', onOk);
            btnCancel.addEventListener('click', onCancel);
            dialog.addEventListener('cancel', onCancel);
        });
    })();
    </script>
    {{template "scripts" .}}
</body>
</html>
{{end}}

{{define "scripts"}}{{end}}
